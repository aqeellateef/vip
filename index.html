<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="color-scheme" content="dark">
<title>بث مباشر وترفيه</title>
<meta name="description" content="بث مباشر للقنوات مع باقة ترفيه كاملة من الأفلام والمسلسلات العربية والأجنبية والتركية والآسيوية والأنمي.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">
<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

<style>
/* ============================================================
   1) VARIABLES & RESET (TV Optimized Focus States)
   ============================================================ */
:root{
  --bg:#070b14;
  --bg-soft:#0c1220;
  --surface:rgba(255,255,255,.045);
  --surface-solid:#121a2c;
  --surface-2:#172033;
  --line:rgba(255,255,255,.09);
  --line-soft:rgba(255,255,255,.06);

  --primary:#17d9f4;
  --primary-2:#3b82f6;
  --live:#ff3b5c;
  --live-2:#ff7a45;
  --purple:#8b5cf6;

  --text:#f4f7fc;
  --muted:#93a1ba;
  --muted-2:#5f6d85;

  --r-xl:26px;
  --r-lg:20px;
  --r-md:15px;
  --r-sm:10px;

  --shadow:0 18px 45px rgba(0,0,0,.38);
  --shadow-sm:0 8px 22px rgba(0,0,0,.25);

  --nav-h:64px;
  --bottom-nav-h:64px;

  --plyr-color-main:#17d9f4;
  --plyr-video-background:#000;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{background:var(--bg);color:var(--text)}
body{
  font-family:'Tajawal',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  padding-top:var(--nav-h);
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
}
button,input,a{font:inherit}
button,a{touch-action:manipulation;cursor:pointer}
a{text-decoration:none;color:inherit}
img{max-width:100%;display:block}
::selection{background:rgba(23,217,244,.35)}

/* TV Remote Focus Support */
button:focus-visible, a:focus-visible, input:focus-visible, .channel-card:focus, .episode:focus, .category-card:focus {
  outline: 3px solid var(--primary) !important;
  outline-offset: 2px !important;
  transform: scale(1.03);
}

.hscroll{scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}

.brand-font{font-family:'Cairo',sans-serif}

/* ============================================================
   2) GLOBAL BACKDROP
   ============================================================ */
.app-bg{
  position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 12% 0%, rgba(23,217,244,.10), transparent 45%),
    radial-gradient(circle at 90% 10%, rgba(139,92,246,.10), transparent 50%),
    radial-gradient(circle at 50% 100%, rgba(255,59,92,.06), transparent 55%),
    var(--bg);
}

/* ============================================================
   3) TOP NAVIGATION
   ============================================================ */
.top-nav{
  position:fixed;top:0;left:0;right:0;z-index:500;
  height:var(--nav-h);
  display:flex;align-items:center;
  background:rgba(7,11,20,.82);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line-soft);
}
.nav-inner{
  width:min(1180px,100%);margin:0 auto;padding:0 14px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:1.05rem;white-space:nowrap}
.brand .brand-mark{
  width:34px;height:34px;border-radius:11px;flex:0 0 34px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  display:grid;place-items:center;color:#04121a;font-size:16px;
  box-shadow:0 6px 16px rgba(23,217,244,.35);
}
.brand span.dim{color:var(--muted);font-weight:600;font-size:.72rem;display:block}

.main-tabs{
  position:relative;display:flex;gap:2px;
  background:var(--surface-solid);border:1px solid var(--line);
  border-radius:999px;padding:4px;
}
.main-tab{
  position:relative;z-index:2;border:0;background:transparent;color:var(--muted);
  font-weight:800;font-size:.86rem;padding:8px 16px;border-radius:999px;
  display:flex;align-items:center;gap:7px;transition:color .25s ease;
  white-space:nowrap;
}
.main-tab i{font-size:.85rem}
.main-tab.active{color:#04121a}
.tab-indicator{
  position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);
  border-radius:999px;z-index:1;
  background:linear-gradient(135deg,var(--live),var(--live-2));
  transition:transform .32s cubic-bezier(.65,0,.35,1),background .3s ease;
  box-shadow:0 6px 16px rgba(255,59,92,.35);
}
.main-tabs[data-active="ent"] .tab-indicator{
  transform:translateX(-100%);
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 6px 16px rgba(23,217,244,.35);
}
html[dir="rtl"] .main-tabs[data-active="ent"] .tab-indicator{transform:translateX(100%)}

.nav-live-pulse{
  width:7px;height:7px;border-radius:50%;background:var(--live);
  box-shadow:0 0 0 0 rgba(255,59,92,.6);
  animation:pulseDot 1.8s infinite;
}
@keyframes pulseDot{
  0%{box-shadow:0 0 0 0 rgba(255,59,92,.55)}
  70%{box-shadow:0 0 0 8px rgba(255,59,92,0)}
  100%{box-shadow:0 0 0 0 rgba(255,59,92,0)}
}

/* ============================================================
   4) APP VIEWS
   ============================================================ */
.app-view{display:none}
.app-view.active{display:block;animation:viewFade .3s ease both}
@keyframes viewFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.shell{width:min(1180px,100%);margin:0 auto;padding:16px 14px 30px}

/* ============================================================
   5) SHARED UI PRIMITIVES
   ============================================================ */
.glass-panel{
  background:var(--surface);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm);
}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 0 13px;gap:10px}
.section-title h2{font-size:1.05rem;font-weight:900;display:flex;align-items:center;gap:9px}
.section-title h2::before{content:"";width:4px;height:20px;border-radius:10px;background:linear-gradient(var(--primary),var(--primary-2))}
.section-count{font-size:.72rem;color:var(--muted);background:var(--surface-solid);border:1px solid var(--line);padding:5px 10px;border-radius:999px;white-space:nowrap}

.loader-overlay{
  position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;background:rgba(5,9,17,.82);backdrop-filter:blur(10px);
}
.loader-overlay.show{display:flex}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid rgba(23,217,244,.18);border-top-color:var(--primary);animation:spin .8s linear infinite}
.loader-overlay span{font-size:14px;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:10000;
  transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#141d30;color:#fff;border:1px solid var(--line);border-radius:13px;
  padding:11px 16px;box-shadow:var(--shadow);font-size:13px;font-weight:700;
  transition:.25s ease;max-width:calc(100% - 32px);text-align:center;
  display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{color:var(--primary)}

.empty-state,.error-state{
  grid-column:1/-1;text-align:center;color:var(--muted);padding:46px 14px;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.empty-state i,.error-state i{font-size:1.9rem;opacity:.7}
.error-state i{color:var(--live)}
.empty-state b,.error-state b{color:var(--text);font-size:.95rem}

.skeleton{position:relative;overflow:hidden;background:var(--surface-2)}
.skeleton::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
  animation:shimmer 1.4s infinite;
}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ============================================================
   6) LIVE SECTION
   ============================================================ */
.live-hero{padding:6px 2px 16px;text-align:center}
.live-hero h1{font-family:'Cairo',sans-serif;font-size:1.5rem;font-weight:900}
.live-hero .subtitle{color:var(--muted);font-size:.85rem;margin-top:4px}

.live-player-section{margin-bottom:16px;padding:14px;display:none}
.live-player-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.live-player-header h3{font-size:.95rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:7px}
#artplayer-container{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000}
.live-servers{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.server-btn{
  background:var(--surface-solid);border:1px solid var(--line);color:#fff;padding:7px 14px;border-radius:10px;
  font-weight:700;font-size:.8rem;transition:.2s;
}
.server-btn.active{background:linear-gradient(135deg,var(--live),var(--live-2));border-color:transparent}
.close-btn{background:var(--surface-solid);border:1px solid var(--line);color:#fff;padding:7px 13px;border-radius:10px;font-weight:800;font-size:.82rem;flex:0 0 auto;transition:.2s}
.close-btn:hover{background:var(--surface-2)}

.channels-section{padding:14px;min-height:180px}
.channels-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px}
.channel-card{
  background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;padding:18px 8px;
  text-align:center;font-weight:800;font-size:.88rem;transition:.18s ease;position:relative;
}
.channel-card:active{transform:scale(.96)}
.channel-card.active-stream{background:rgba(255,59,92,.14);border-color:var(--live)}
.channel-card.active-stream::after{
  content:"● مباشر";position:absolute;top:6px;left:6px;font-size:.62rem;color:var(--live);font-weight:900;
}

/* ============================================================
   7) ENTERTAINMENT SECTION
   ============================================================ */
.ent-search-area{position:sticky;top:var(--nav-h);z-index:60;padding:2px 0 12px;background:linear-gradient(to bottom,var(--bg) 78%,rgba(7,11,20,0))}
.ent-search-box{
  height:52px;background:var(--surface-solid);border:1px solid var(--line);border-radius:16px;
  display:flex;align-items:center;gap:11px;padding:0 15px;box-shadow:var(--shadow-sm);
}
.ent-search-box:focus-within{border-color:rgba(23,217,244,.6);box-shadow:0 0 0 3px rgba(23,217,244,.09)}
.ent-search-box i{color:var(--primary);font-size:17px}
.ent-search-box input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;font-size:15px}
.ent-search-box input::placeholder{color:var(--muted-2)}
.ent-search-go{width:38px;height:38px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#04121a;display:grid;place-items:center;font-weight:900;flex:0 0 auto}

.ent-type-tabs{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 20px;background:var(--surface-solid);padding:5px;border:1px solid var(--line);border-radius:16px}
.ent-type-tab{height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s ease}
.ent-type-tab.active{background:linear-gradient(135deg,rgba(23,217,244,.16),rgba(59,130,246,.16));color:#fff;box-shadow:inset 0 0 0 1px rgba(23,217,244,.32)}
.ent-type-tab.active i{color:var(--primary)}

.ent-view{display:none;animation:viewFade .28s ease both}
.ent-view.active{display:block}

.category-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding-top:4px}
.category-card{
  min-height:108px;background:radial-gradient(circle at 50% 0%,rgba(23,217,244,.12),transparent 55%),var(--surface-solid);
  border:1px solid var(--line);border-radius:20px;padding:14px 8px 12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:9px;box-shadow:var(--shadow-sm);transition:transform .18s ease,border-color .18s ease;
}
.category-card:active{transform:scale(.95);border-color:rgba(23,217,244,.5)}
.cat-icon{width:50px;height:50px;flex:0 0 50px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(23,217,244,.15),rgba(59,130,246,.08));color:#dffbff;font-size:22px;border:1px solid rgba(23,217,244,.18)}
.cat-copy strong{display:block;font-size:.82rem;font-weight:900;white-space:nowrap}

.ent-content-head{
  position:sticky;top:var(--nav-h);z-index:70;display:flex;align-items:center;gap:10px;
  margin:0 -14px 15px;padding:10px 14px;background:rgba(7,11,20,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft);
}
.round-back{width:41px;height:41px;flex:0 0 41px;border:1px solid var(--line);border-radius:13px;background:var(--surface-solid);color:#fff;display:grid;place-items:center}
.ent-content-head h2{font-size:1rem;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.media-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.media-item{position:relative;overflow:hidden;border-radius:14px;background:var(--surface-solid);border:1px solid var(--line);box-shadow:var(--shadow-sm);min-width:0;transition:transform .15s ease}
.media-item:active{transform:scale(.97)}
.poster-wrap{position:relative;aspect-ratio:2/3;background:#111827;overflow:hidden}
.media-item img{width:100%;height:100%;object-fit:cover;background:#111827}
.media-badge{position:absolute;top:7px;right:7px;padding:4px 7px;border-radius:8px;background:rgba(2,6,23,.78);backdrop-filter:blur(8px);font-size:9px;font-weight:900;color:var(--primary);border:1px solid var(--line-soft)}
.media-title{padding:9px 7px 10px;font-size:.75rem;font-weight:800;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}

.load-more{width:100%;height:48px;margin-top:16px;border:1px solid rgba(23,217,244,.25);border-radius:15px;background:rgba(23,217,244,.08);color:var(--primary);font-weight:800}

.details-title{font-size:1.2rem;font-weight:900;line-height:1.6;margin:2px 0 14px;text-align:center;font-family:'Cairo',sans-serif}
.player-card{background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
.player-card iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
.plyr{border-radius:16px}

.player-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:11px 0 18px}
.ent-action{min-height:45px;border:1px solid var(--line);border-radius:13px;background:var(--surface-solid);color:#fff;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:.8rem}

.episodes-card{margin-top:15px;background:var(--surface-solid);border:1px solid var(--line);border-radius:18px;padding:14px}
.episodes-card .section-title{margin-top:0}
.episode-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.episode{border:1px solid var(--line);border-radius:15px;background:var(--surface-2);color:#fff;overflow:hidden;text-align:right;box-shadow:var(--shadow-sm);min-width:0;transition:transform .15s ease}
.episode:active{transform:scale(.98)}
.episode-poster{width:100%;aspect-ratio:16/9;object-fit:cover;background:#0f172a}
.episode-info{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px}
.episode-name{font-size:.8rem;font-weight:800}
.episode-play{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;background:rgba(23,217,244,.12);color:var(--primary);flex:0 0 29px}
.episode.active{border-color:rgba(23,217,244,.55);box-shadow:0 0 0 1px rgba(23,217,244,.18),var(--shadow-sm)}

body.cinema-mode{background:#000;overflow:hidden}
body.cinema-mode .top-nav,body.cinema-mode .bottom-nav{display:none}
.cinema-shell{
  position:fixed!important;inset:0!important;z-index:20500!important;background:#000!important;
  margin:0!important;padding:0!important;border-radius:0!important;width:100vw!important;height:100vh!important;
  display:flex!important;align-items:center!important;justify-content:center!important;
}
.cinema-shell .player-card{width:100vw!important;height:100vh!important;border:0!important;border-radius:0!important;display:flex;align-items:center;justify-content:center}
.cinema-shell .plyr,.cinema-shell video,.cinema-shell iframe{width:100%!important;height:100%!important;max-height:100vh!important;border-radius:0!important}
.cinema-shell .player-actions{display:none!important}
.plyr__control--overlaid{transform:translate(-50%,-50%) scale(1.1);background:rgba(12,20,32,.88)!important;border:1px solid rgba(255,255,255,.18)!important}
.cinema-shell .plyr__controls{padding:18px max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))!important;background:linear-gradient(transparent,rgba(2,6,12,.9))!important}
.cinema-shell video{object-fit:contain;background:#000}

/* ============================================================
   8) BOTTOM MOBILE NAV
   ============================================================ */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:400;display:none;
  padding:8px 14px calc(8px + env(safe-area-inset-bottom));
  background:rgba(7,11,20,.92);backdrop-filter:blur(18px);border-top:1px solid var(--line-soft);
  gap:8px;
}
.bottom-nav button{
  flex:1;border:0;background:transparent;color:var(--muted);border-radius:14px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:.68rem;
}
.bottom-nav button i{font-size:1.05rem}
.bottom-nav button.active{color:var(--primary)}
.bottom-nav button.active[data-tab="live"]{color:var(--live)}

@media(max-width:640px){
  .bottom-nav{display:flex}
  body{padding-bottom:calc(var(--bottom-nav-h) + env(safe-area-inset-bottom))}
  .brand span.dim{display:none}
}
@media(min-width:560px){
  .category-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .media-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .episode-list{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(min-width:900px){
  .shell{padding-left:22px;padding-right:22px}
  .category-grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .media-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
  .episode-list{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>
<body>
<div class="app-bg"></div>

<!-- ===================== TOP NAVIGATION ===================== -->
<header class="top-nav">
  <div class="nav-inner">
    <div class="brand brand-font">
      <span class="brand-mark"><i class="fa-solid fa-play"></i></span>
      <span>Smart TV Player<span class="dim">بث مباشر · ترفيه</span></span>
    </div>
    <nav class="main-tabs" id="mainTabs" data-active="live">
      <span class="tab-indicator"></span>
      <button class="main-tab active" data-tab="live" onclick="switchMainTab('live')">
        <span class="nav-live-pulse"></span> البث المباشر
      </button>
      <button class="main-tab" data-tab="ent" onclick="switchMainTab('ent')">
        <span class="fa-solid fa-clapperboard"></span> الترفيه
      </button>
    </nav>
  </div>
</header>

<!-- ===================== BOTTOM MOBILE NAV ===================== -->
<nav class="bottom-nav" id="bottomNav">
  <button class="active" data-tab="live" onclick="switchMainTab('live')"><i class="fa-solid fa-satellite-dish"></i>البث المباشر</button>
  <button data-tab="ent" onclick="switchMainTab('ent')"><i class="fa-solid fa-clapperboard"></i>الترفيه</button>
</nav>

<!-- ===================== LIVE APP VIEW ===================== -->
<main id="app-live" class="app-view active">
  <div class="shell">

    <div class="live-hero">
      <h1 class="brand-font">قنوات beIN SPORTS</h1>
      <div class="subtitle">اختر القناة للمتابعة الفورية</div>
    </div>

    <section id="player-container" class="live-player-section glass-panel">
      <div class="live-player-header">
        <h3 id="current-channel-title"><span class="nav-live-pulse"></span> اسم القناة</h3>
        <button class="close-btn" onclick="Live.closePlayer()"><i class="fa-solid fa-xmark"></i> إغلاق</button>
      </div>
      <div id="artplayer-container"></div>
      <div class="live-servers" id="servers-list"></div>
    </section>

    <!-- تم إخفاء شريط الباقات لأننا خصصنا العرض لقنوات بي إن سبورت فقط -->

<script>
function toggleLoader(show){
  document.getElementById('loader').classList.toggle('show', !!show);
}

function showToast(message, icon){
  const el = document.getElementById('toast');
  el.innerHTML = `<i class="fa-solid ${icon || 'fa-circle-info'}"></i><span>${message}</span>`;
  el.classList.add('show');
  clearTimeout(showToast.t);
  showToast.t = setTimeout(() => el.classList.remove('show'), 2400);
}

function escapeHtml(value){
  return String(value).replace(/[&<>'"]/g, c => ({'&':'&','<':'<','>':'>',"'":''','"':'"'}[c]));
}
function escapeAttr(value){ return escapeHtml(value); }

let activeMainTab = 'live';

function switchMainTab(tab){
  if (tab === activeMainTab) return;
  activeMainTab = tab;

  document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
  document.getElementById('app-' + tab).classList.add('active');

  document.querySelectorAll('.main-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('mainTabs').setAttribute('data-active', tab);

  if (tab === 'ent') {
    Live.pause();
  } else {
    Ent.pausePlayer();
  }

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ================================================================
   LIVE MODULE
   ================================================================ */
const Live = (function(){
  const PROXY_WORKER = "https://yacine-proxy.hsinnzaer5.workers.dev";
  let artInstance = null;
  let currentHls = null;

  async function fetchBeinChannels(){
    const grid = document.getElementById("channels");
    const count = document.getElementById("channelsCount");
    
    try{
      const res = await fetch(`${PROXY_WORKER}/api/categories`);
      const data = await res.json();
      if (data.error) throw new Error(data.message);

      const categories = Array.isArray(data) ? data : (data.categories || data.data || []);
      
      // البحث عن الباقة التي تحتوي على قنوات رياضية أو بي إن سبورت
      let targetCatId = null;
      for (const cat of categories){
        const name = (cat.name || cat.title || "").toLowerCase();
        if (name.includes('bein') || name.includes('رياض') || name.includes('sport') || name.includes('البين')) {
          targetCatId = cat.id;
          break;
        }
      }

      // إذا لم يجد باقة مخصصة، يأخذ أول باقة أو يبحث داخل جميع الباقات
      if (!targetCatId && categories.length > 0) {
        targetCatId = categories[0].id;
      }

      if (!targetCatId) throw new Error("لم يتم العثور على باقات متاحة");

      // جلب قنوات الباقة وتصفية ما يخص beIN SPORTS
      const chRes = await fetch(`${PROXY_WORKER}/api/categories/${targetCatId}/channels`);
      const chData = await chRes.json();
      if (chData.error) throw new Error(chData.message);

      let channels = Array.isArray(chData) ? chData : (chData.channels || chData.data || []);
      
      // فلترة القنوات لتظهر فقط قنوات beIN Sports أو الرياضية المشابهة
      channels = channels.filter(ch => {
        const name = (ch.name || ch.title || "").toLowerCase();
        return name.includes('bein') || name.includes('بي إن');
      });

      if (channels.length === 0){
        // كحل بديل إذا لم تنطبق الفلترة الحرفية، نعرض كل القنوات الرياضية المتاحة
        channels = Array.isArray(chData) ? chData : (chData.channels || chData.data || []);
      }

      if (channels.length === 0){
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><i class="fa-solid fa-tv"></i><b>لا توجد قنوات</b><span>لا توجد قنوات بي إن سبورت متاحة حالياً</span></div>`;
        count.textContent = "0 قناة";
        return;
      }

      count.textContent = `${channels.length} قناة`;
      grid.innerHTML = "";
      channels.forEach(ch => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "channel-card";
        card.textContent = ch.name || ch.title;
        card.onclick = () => {
          document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
          card.classList.add("active-stream");
          loadChannel(ch.id, ch.name || ch.title);
        };
        grid.appendChild(card);
      });

    }catch(err){
      grid.innerHTML = `<div class="error-state" style="grid-column:1/-1"><i class="fa-solid fa-triangle-exclamation"></i><b>تعذر تحميل القنوات</b><span>${escapeHtml(err.message)}</span></div>`;
      count.textContent = "—";
    }
  }

  async function loadChannel(channelId, channelName){
    const container = document.getElementById("player-container");
    const title = document.getElementById("current-channel-title");
    const serversDiv = document.getElementById("servers-list");

    container.style.display = "block";
    title.innerHTML = `<span class="nav-live-pulse"></span> جاري تجهيز سيرفرات: ${escapeHtml(channelName)}...`;
    serversDiv.innerHTML = "";
    container.scrollIntoView({ behavior: "smooth", block: "start" });

    try{
      const res = await fetch(`${PROXY_WORKER}/api/channel/${channelId}`);
      const data = await res.json();
      if (data.error) throw new Error(data.message);

      let streamList = [];
      if (Array.isArray(data)) streamList = data;
      else if (data.data && Array.isArray(data.data)) streamList = data.data;
      else if (data.url || data.stream_url) streamList = [{ name: "السيرفر الرئيسي", url: data.url || data.stream_url }];

      if (streamList.length === 0) throw new Error("السيرفرات غير متوفرة حالياً");

      title.innerHTML = `<span class="nav-live-pulse"></span> ${escapeHtml(channelName)}`;

      let defaultIndex = 0;
      streamList.forEach((st, idx) => {
        const name = (st.name || st.quality || '').toLowerCase();
        if (name.includes('720') || name.includes('sd')) defaultIndex = idx;
      });

      streamList.forEach((st, idx) => {
        const targetUrl = st.url || st.stream_url;
        if (!targetUrl) return;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `server-btn ${idx === defaultIndex ? 'active' : ''}`;
        btn.textContent = st.name || st.quality || `سيرفر ${idx + 1}`;
        btn.onclick = () => {
          document.querySelectorAll(".server-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          startArtPlayer(targetUrl);
        };
        serversDiv.appendChild(btn);
      });

      const firstUrl = streamList[defaultIndex].url || streamList[defaultIndex].stream_url;
      if (firstUrl) startArtPlayer(firstUrl);

    }catch(err){
      title.textContent = `خطأ: ${err.message}`;
      showToast(`تعذر تشغيل ${channelName}: ${err.message}`, 'fa-triangle-exclamation');
    }
  }

  function startArtPlayer(rawUrl){
    const proxiedStreamUrl = `${PROXY_WORKER}?stream=${encodeURIComponent(rawUrl)}`;

    if (currentHls){
      currentHls.stopLoad(); currentHls.detachMedia(); currentHls.destroy(); currentHls = null;
    }
    if (artInstance){
      if (artInstance.video){
        artInstance.video.pause();
        artInstance.video.removeAttribute('src');
        artInstance.video.load();
      }
      artInstance.destroy(true);
      artInstance = null;
    }

    const container = document.getElementById('artplayer-container');
    container.innerHTML = "";

    artInstance = new Artplayer({
      container: '#artplayer-container',
      url: proxiedStreamUrl,
      type: 'm3u8',
      isLive: true,
      autoplay: true,
      fullscreen: true,
      fullscreenWeb: true,
      playsInline: true,
      customType: {
        m3u8: function (video, url){
          if (Hls.isSupported()){
            const hls = new Hls({
              enableWorker: true,
              lowLatencyMode: false,
              liveSyncDurationCount: 3,
              maxBufferLength: 8,
              maxMaxBufferLength: 16
            });
            hls.loadSource(url);
            hls.attachMedia(video);
            currentHls = hls;
            hls.on(Hls.Events.ERROR, function (event, data){
              if (data.fatal){
                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
                else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
                else hls.destroy();
              }
            });
          } else if (video.canPlayType('application/vnd.apple.mpegurl')){
            video.src = url;
          }
        },
      },
    });
  }

  function closePlayer(){
    if (currentHls){ currentHls.stopLoad(); currentHls.detachMedia(); currentHls.destroy(); currentHls = null; }
    if (artInstance){
      if (artInstance.video){
        artInstance.video.pause();
        artInstance.video.removeAttribute('src');
        artInstance.video.load();
      }
      artInstance.destroy(true);
      artInstance = null;
    }
    document.getElementById("player-container").style.display = "none";
    document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
  }

  function pause(){
    try{ if (artInstance && artInstance.video) artInstance.video.pause(); }catch(e){}
  }

  return { fetchBeinChannels, loadChannel, closePlayer, pause };
})();

  let currentPage = 1;
  let isSearching = false;
  let currentView = 'entHomeView';
  let globalEpisodes = [];
  let currentEpisodeNum = -1;
  let playerInstance = null;
  let hlsInstance = null;

  let currentMediaTitle = '';
  let searchTimer = null;
  let lastSearchQuery = '';

  function renderCategories(){

    data.forEach(item => {

  function switchType(type){
    activeType = type;
    document.getElementById('seriesTab').classList.toggle('active', type === 'series');
    document.getElementById('moviesTab').classList.toggle('active', type === 'movies');
    if (currentView !== 'entHomeView') showView('entHomeView', false);
    renderCategories();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showView(viewId, push = true){
    document.querySelectorAll('.ent-view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    currentView = viewId;
    document.getElementById('entSearchArea').style.display = viewId === 'entHomeView' ? 'block' : 'none';
    if (push && history.state?.entView !== viewId) history.pushState({ entView: viewId, mainTab: 'ent' }, '', location.href);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goBack(){
    if (history.state && history.state.entView !== 'entHomeView') history.back();
    else showView('entHomeView', false);
  }

  window.addEventListener('popstate', (e) => {
    if (e.state && e.state.mainTab && e.state.mainTab !== activeMainTab){
      switchMainTab(e.state.mainTab);
    }
    destroyPlayer();
    if (currentView === 'entDetailsView' && document.getElementById('mediaGrid').children.length){
      showView('entGridView', false);
    } else {
      showView('entHomeView', false);
    }
  });

  function destroyPlayer(){
    exitCinemaFullscreen();
    try{ if (playerInstance){ playerInstance.destroy(); playerInstance = null; } }catch(e){}
    try{ if (hlsInstance){ hlsInstance.destroy(); hlsInstance = null; } }catch(e){}
    document.getElementById('videoContainer').innerHTML = '';
  }

  function pausePlayer(){
    try{
      const v = document.getElementById('plyrPlayer');
      if (v) v.pause();
    }catch(e){}
  }

  async function fetchAPI(endpoint){
    toggleLoader(true);
    try{
      const response = await fetch(API_URL + endpoint, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return await response.json();
    }catch(error){
      showToast('تعذر الاتصال. تأكد من الإنترنت ثم أعد المحاولة.', 'fa-triangle-exclamation');
      return null;
    }finally{
      toggleLoader(false);
    }
  }

  async function loadGenre(url, title, page = 1){
    if (page === 1){
      currentGenreUrl = url;
      currentPage = 1;
      isSearching = false;
      document.getElementById('mediaGrid').innerHTML = renderSkeletons();
      document.getElementById('gridTitle').textContent = title;
      document.getElementById('loadMoreBtn').style.display = 'none';
      showView('entGridView');
    }
    const data = await fetchAPI(`?action=genre&genre=${encodeURIComponent(url)}&p=${page}`);
    if (page === 1) document.getElementById('mediaGrid').innerHTML = '';
    if (data && data.status === 'success'){
      renderCards(Array.isArray(data.data) ? data.data : []);
      document.getElementById('loadMoreBtn').style.display = data.data && data.data.length ? 'block' : 'none';
    } else if (page === 1){
      document.getElementById('mediaGrid').innerHTML = `<div class="error-state"><i class="fa-solid fa-triangle-exclamation"></i><b>تعذر التحميل</b><span>حدث خطأ أثناء جلب المحتوى، حاول مرة أخرى.</span></div>`;

    showToast(`جاري تشغيل الحلقة ${ep.num}...`, 'fa-circle-play');
    const data = await fetchAPI(`?action=series&series=${encodeURIComponent(ep.link)}`);
    if (data && data.status === 'success' && data.media_src){
      document.getElementById('mediaTitle').textContent = `${currentMediaTitle} - الحلقة ${ep.num}`;
      document.getElementById('playerSection').style.display = 'block';
      setupPlayer(data, true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } else {
      showToast('تعذر تشغيل هذه الحلقة حالياً.', 'fa-triangle-exclamation');
    }
  }

  function setupPlayer(data, autoFullscreen = false){
    const section = document.getElementById('playerSection');
    const container = document.getElementById('videoContainer');
    section.style.display = 'block';
    destroyPlayer();
    if (autoFullscreen) enterCinemaFullscreen();

    if (data.is_iframe){
      container.innerHTML = `<iframe src="${escapeAttr(data.media_src)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
    } else {
      container.innerHTML = '<video id="plyrPlayer" playsinline controls></video>';
      const video = document.getElementById('plyrPlayer');
      const options = {
        controls: ['play-large','restart','rewind','play','fast-forward','progress','current-time','duration','mute','volume','captions','settings','pip','airplay','fullscreen'],
        settings: ['quality','speed'],
        seekTime: 10,
        autoplay: true,
        fullscreen: { enabled: true, fallback: true, iosNative: true }
      };
      if (String(data.media_src).includes('.m3u8') && window.Hls && Hls.isSupported()){
        hlsInstance = new Hls({ enableWorker: true });
        hlsInstance.loadSource(data.media_src);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
          playerInstance = new Plyr(video, options);
          playerInstance.play().catch(() => {});
          if (autoFullscreen) setTimeout(() => enterCinemaFullscreen(), 80);
        });
      } else {
        video.src = data.media_src;
        playerInstance = new Plyr(video, options);
        playerInstance.play().catch(() => {});
        if (autoFullscreen) setTimeout(() => enterCinemaFullscreen(), 80);
      }
    }

    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    nextBtn.style.display = 'none';
    prevBtn.style.display = 'none';
    if (currentEpisodeNum !== -1 && globalEpisodes.length){
      const idx = globalEpisodes.findIndex(e => Number(e.num) === Number(currentEpisodeNum));
      if (idx > 0){
        prevBtn.style.display = 'flex';
        prevBtn.onclick = () => playEpisodeDirectly(globalEpisodes[idx - 1]);
      }
      if (idx !== -1 && idx < globalEpisodes.length - 1){
        nextBtn.style.display = 'flex';
        nextBtn.onclick = () => playEpisodeDirectly(globalEpisodes[idx + 1]);
      }
    }
  }

  function enterCinemaFullscreen(){
    const section = document.getElementById('playerSection');
    section.classList.add('cinema-shell');
    document.body.classList.add('cinema-mode');
    try{
      const req = section.requestFullscreen || section.webkitRequestFullscreen || section.msRequestFullscreen;
      if (req) Promise.resolve(req.call(section)).catch(() => {});
    }catch(e){}
    try{ if (screen.orientation?.lock) screen.orientation.lock('landscape').catch(() => {}); }catch(e){}
  }

  function exitCinemaFullscreen(){
    document.getElementById('playerSection')?.classList.remove('cinema-shell');
    document.body.classList.remove('cinema-mode');
    try{ if (screen.orientation?.unlock) screen.orientation.unlock(); }catch(e){}
  }

  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) exitCinemaFullscreen(); });
  document.addEventListener('webkitfullscreenchange', () => { if (!document.webkitFullscreenElement) exitCinemaFullscreen(); });

  function initSearchBinding(){
    const input = document.getElementById('searchInput');
    input.addEventListener('input', () => {
      const query = input.value.trim();
      clearTimeout(searchTimer);
      if (!query){
        lastSearchQuery = '';
        showView('entHomeView', false);
        return;
      }
      searchTimer = setTimeout(() => {
        if (query !== lastSearchQuery){
          lastSearchQuery = query;
          executeSearch();
        }
      }, 250);
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){
        e.preventDefault();
        clearTimeout(searchTimer);
        lastSearchQuery = input.value.trim();
        executeSearch();
      }
    });
  }

  function init(){
    initSearchBinding();
    renderCategories();
  }

  return {
    switchType, goBack, loadMore, executeSearch,
    pausePlayer, init
  };
})();

document.addEventListener("DOMContentLoaded", () => {
  history.replaceState({ entView: 'entHomeView', mainTab: 'live' }, '', location.href);
  Live.fetchBeinChannels();
  Ent.init();
});
</script>
</body>
