<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بث مباشر - قنوات VIP</title>
    <!-- استدعاء مكتبة تشغيل البث HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Tahoma, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 20px; color: #38bdf8; }
        .player-container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
            aspect-ratio: 16/9;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            max-width: 800px;
            margin: 0 auto;
        }
        button {
            background-color: #1e293b;
            color: #ffffff;
            border: 2px solid #38bdf8;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
    </style>
</head>
<body>

    <h1>مشغل القنوات المباشرة</h1>

    <!-- شاشة البث -->
    <div class="player-container">
        <video id="video" controls autoplay></video>
    </div>

    <!-- أزرار القنوات -->
    <div class="channels-grid">
        <button onclick="playChannel('bein1')">Bein Sport 1</button>
        <button onclick="playChannel('iraqia')">العراقية الرياضية</button>
        <button onclick="playChannel('gewher')">جوهر سبورت</button>
    </div>

    <script>
        const video = document.getElementById('video');
        let hls = null;

        async function playChannel(channelName) {
            try {
                // طلب الرابط من سيرفر الـ API الوسيط الخاص بك
                const response = await fetch(`/api/proxy?channel=${channelName}`);
                if (!response.ok) throw new Error("فشل جلب رابط القناة");
                
                const streamUrl = await response.text();
                
                if (Hls.isSupported()) {
                    if (hls) {
                        hls.destroy();
                    }
                    hls = new Hls();
                    hls.loadSource(streamUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play();
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                    video.addEventListener('loadedmetadata', function() {
                        video.play();
                    });
                }
            } catch (error) {
                alert("عذراً، حدث خطأ أثناء تشغيل القناة.");
                console.error(error);
            }
        }
    </script>

</body>
</html>
