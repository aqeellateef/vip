<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Live Sports Stream</title> 

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"> 

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>

<style>
:root {
  --primary-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  --accent: #06b6d4;
  --accent-glow: rgba(6, 182, 212, 0.4);
  --glass-bg: rgba(15, 23, 42, 0.75);
  --glass-border: rgba(255, 255, 255, 0.08);
  --blur: blur(20px);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--primary-gradient);
  padding: 14px;
  min-height: 100vh;
  color: #f8fafc;
}

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: var(--blur);
  -webkit-backdrop-filter: var(--blur);
  border: 1px solid var(--glass-border);
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

.header { text-align: center; padding: 18px; margin-bottom: 14px; }
.header h1 { font-size: 1.6rem; font-weight: 800; color: #fff; letter-spacing: -0.5px; }
.subtitle { color: #94a3b8; font-size: 0.8rem; margin-top: 4px; }

.player-section { margin-bottom: 14px; padding: 14px; display: none; }
.player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.player-header h3 { font-size: 0.95rem; font-weight: 700; color: #e2e8f0; }
#artplayer-container { width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden; background: #000; }

.servers-container { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
.servers-title { font-size: 0.8rem; color: #94a3b8; font-weight: 600; margin-left: 4px; }
.server-btn {
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #cbd5e1;
  padding: 6px 14px;
  border-radius: 10px;
  cursor: pointer;
  font-family: 'Cairo';
  font-size: 0.78rem;
  font-weight: 600;
  transition: all 0.2s ease;
}
.server-btn.active { background: var(--accent); border-color: var(--accent); color: #0f172a; box-shadow: 0 0 12px var(--accent-glow); }

.categories-bar { 
  display: flex; 
  gap: 8px; 
  overflow-x: auto; 
  white-space: nowrap; 
  padding: 4px 2px 14px 2px; 
  scrollbar-width: none; 
}
.categories-bar::-webkit-scrollbar { display: none; }

.cat-btn {
  display: inline-block;
  flex: 0 0 auto;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: #94a3b8;
  padding: 8px 18px;
  border-radius: 25px;
  cursor: pointer;
  font-family: 'Cairo';
  font-weight: 700;
  font-size: 0.82rem;
  transition: all 0.2s ease;
}
.cat-btn.active { 
  background: var(--accent); 
  border-color: var(--accent); 
  color: #0f172a; 
  box-shadow: 0 0 15px var(--accent-glow);
}

.channels-section { padding: 14px; min-height: 220px; }
.channels-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }

.channel-card {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 14px;
  padding: 14px 8px;
  cursor: pointer;
  text-align: center;
  font-weight: 700;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
}
.channel-card:active { transform: scale(0.96); }
.channel-card.active-stream { 
  background: rgba(6, 182, 212, 0.12); 
  border-color: var(--accent); 
  box-shadow: 0 0 12px rgba(6, 182, 212, 0.2);
}

.channel-img {
  width: 50px;
  height: 50px;
  object-fit: contain;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.3);
  padding: 5px;
}

.channel-name {
  font-size: 0.78rem;
  line-height: 1.3;
  color: #e2e8f0;
}

.close-btn { 
  background: rgba(255, 255, 255, 0.08); 
  border: 1px solid rgba(255, 255, 255, 0.12); 
  color: #f8fafc; 
  padding: 4px 12px; 
  border-radius: 8px; 
  cursor: pointer; 
  font-family: 'Cairo'; 
  font-size: 0.75rem;
}

.loading-text { text-align: center; padding: 35px; font-weight: 600; color: #94a3b8; grid-column: 1 / -1; font-size: 0.85rem; }
</style>
</head> 

<body> 

<header class="header glass-panel">
  <h1>Live Sports Stream</h1>
  <div class="subtitle">بث مباشر عالي الجودة مع تبديل الجودات</div>
</header> 

<section id="player-container" class="player-section glass-panel">
  <div class="player-header">
    <h3 id="current-channel-title">اسم القناة</h3>
    <button class="close-btn" onclick="closePlayer()">✕ إغلاق</button>
  </div>
  <div id="artplayer-container"></div>
  <div class="servers-container" id="servers-list">
    <span class="servers-title">الجودات:</span>
  </div>
</section>

<div class="categories-bar" id="categories-bar">
  <div class="loading-text" style="padding: 10px;">جاري جلب الأقسام...</div>
</div>

<section class="channels-section glass-panel">
  <div class="channels-grid" id="channels">
    <div class="loading-text">اختر قسماً لعرض القنوات المتاحة</div>
  </div>
</section>

<script>
const PROXY_WORKER = "https://yacine-proxy.hsinnzaer5.workers.dev";
let artInstance = null;
let currentHls = null;

async function fetchCategories() {
  const catBar = document.getElementById("categories-bar");
  try {
    const res = await fetch(`${PROXY_WORKER}/api/categories`);
    const data = await res.json();
    const categories = Array.isArray(data) ? data : (data.categories || data.data || []);

    if (categories.length === 0) throw new Error("لم يتم العثور على أقسام");

    catBar.innerHTML = "";
    categories.forEach((cat, index) => {
      const btn = document.createElement("button");
      btn.className = `cat-btn ${index === 0 ? 'active' : ''}`;
      btn.textContent = cat.name || cat.title || `قسم ${cat.id}`;
      btn.onclick = () => {
        document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        fetchChannels(cat.id);
      };
      catBar.appendChild(btn);
    });

    if (categories.length > 0) {
      fetchChannels(categories[0].id);
    }
  } catch (err) {
    catBar.innerHTML = `<div class="loading-text" style="padding: 10px;">⚠️ تعذر تحميل الأقسام: ${err.message}</div>`;
  }
}

async function fetchChannels(categoryId) {
  const grid = document.getElementById("channels");
  grid.innerHTML = `<div class="loading-text">جاري جلب قنوات القسم...</div>`;

  try {
    const res = await fetch(`${PROXY_WORKER}/api/category/${categoryId}`);
    const data = await res.json();
    const channels = Array.isArray(data) ? data : (data.channels || data.data || []);

    if (channels.length === 0) {
      grid.innerHTML = `<div class="loading-text">لا توجد قنوات متاحة في هذا القسم حالياً</div>`;
      return;
    }

    // دمج القنوات المتشابهة (مثلاً منع تكرار نفس القناة إذا كانت مقسمة بل تظهر مرة واحدة وتجمع جوداتها)
    const groupedChannels = {};
    channels.forEach(ch => {
      let rawName = (ch.name || ch.title || "قناة رياضية").trim();
      // تنظيف اسم القناة من كلمة الجودة لتوحيدها (مثل إزالة 720p أو HD لتبقى مثل "Bein Sport 1")
      let cleanName = rawName.replace(/(\b240p?\b|\b360p?\b|\b480p?\b|\b720p?\b|\b1080p?\b|\bhd?\b|\bsd?\b)/gi, "").trim();
      if (!cleanName) cleanName = rawName;

      if (!groupedChannels[cleanName]) {
        groupedChannels[cleanName] = {
          id: ch.id, // نعتمد معرف أول ركيزة أو المعفر الأساسي
          name: cleanName,
          logo: ch.logo || ch.image || ch.thumbnail,
          originalItems: []
        };
      }
      groupedChannels[cleanName].originalItems.push(ch);
    });

    grid.innerHTML = "";
    Object.values(groupedChannels).forEach(group => {
      const card = document.createElement("div");
      card.className = "channel-card";
      
      const imgUrl = group.logo || "https://i.ibb.co/6W3Q1z2/placeholder.png";

      card.innerHTML = `
        <img class="channel-img" src="${imgUrl}" alt="${group.name}" onerror="this.src='https://i.ibb.co/6W3Q1z2/placeholder.png'">
        <div class="channel-name">${group.name}</div>
      `;

      card.onclick = () => {
        document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
        card.classList.add("active-stream");
        loadUnifiedChannel(group);
      };
      grid.appendChild(card);
    });
  } catch (err) {
    grid.innerHTML = `<div class="loading-text">⚠️ تعذر تحميل القنوات: ${err.message}</div>`;
  }
}

async function loadUnifiedChannel(group) {
  const container = document.getElementById("player-container");
  const title = document.getElementById("current-channel-title");
  const serversDiv = document.getElementById("servers-list");

  container.style.display = "block";
  title.textContent = `جاري تجهيز جودات: ${group.name}...`;
  serversDiv.innerHTML = `<span class="servers-title">الجودات:</span>`;
  container.scrollIntoView({ behavior: "smooth" });

  try {
    let allStreams = [];

    // جلب الروابط لكل العناصر المرتبطة بهذا الاسم الموحد
    for (let item of group.originalItems) {
      try {
        const res = await fetch(`${PROXY_WORKER}/api/channel/${item.id}`);
        const data = await res.json();
        if (Array.isArray(data)) {
          allStreams.push(...data);
        } else if (data.data && Array.isArray(data.data)) {
          allStreams.push(...data.data);
        } else if (data.url || data.stream_url) {
          allStreams.push({ name: item.name, url: data.url || data.stream_url });
        }
      } catch (e) {
        console.error("خطأ في جلب تفاصيل القناة", e);
      }
    }

    if (allStreams.length === 0) {
      // محاولة أخيرة عبر الـ id المباشر لو لم تنجح الحلقات
      const res = await fetch(`${PROXY_WORKER}/api/channel/${group.id}`);
      const data = await res.json();
      if (Array.isArray(data)) allStreams = data;
      else if (data.data && Array.isArray(data.data)) allStreams = data.data;
      else if (data.url || data.stream_url) allStreams = [{ name: "سيرفر رئيسي", url: data.url || data.stream_url }];
    }

    if (allStreams.length === 0) throw new Error("السيرفرات غير متوفرة حالياً");

    title.textContent = `🔴 بث مباشر: ${group.name}`;

    // ترتيب الجودات تصاعدياً أو تنازلياً إذا توفرت الأسماء
    let defaultIndex = 0;
    allStreams.forEach((st, idx) => {
      const qName = (st.name || st.quality || '').toLowerCase();
      if (qName.includes('720') || qName.includes('hd')) defaultIndex = idx;
    });

    allStreams.forEach((st, idx) => {
      const targetUrl = st.url || st.stream_url;
      if (!targetUrl) return;

      const btn = document.createElement("button");
      btn.className = `server-btn ${idx === defaultIndex ? 'active' : ''}`;
      btn.textContent = st.name || st.quality || `جودة ${idx + 1}`;
      btn.onclick = () => {
        document.querySelectorAll(".server-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        startArtPlayer(targetUrl);
      };
      serversDiv.appendChild(btn);
    });

    const firstUrl = allStreams[defaultIndex].url || allStreams[defaultIndex].stream_url;
    if (firstUrl) startArtPlayer(firstUrl);

  } catch (err) {
    title.textContent = `خطأ: ${err.message}`;
  }
}

function startArtPlayer(rawUrl) {
  const proxiedStreamUrl = `${PROXY_WORKER}?stream=${encodeURIComponent(rawUrl)}`;

  if (currentHls) {
    currentHls.stopLoad();
    currentHls.detachMedia();
    currentHls.destroy();
    currentHls = null;
  }

  if (artInstance) {
    if (artInstance.video) {
      artInstance.video.pause();
      artInstance.video.removeAttribute('src');
      artInstance.video.load();
    }
    artInstance.destroy(true);
    artInstance = null;
  }

  const container = document.getElementById('artplayer-container');
  container.innerHTML = "";

  artInstance = new Artplayer({
    container: '#artplayer-container',
    url: proxiedStreamUrl,
    type: 'm3u8',
    isLive: true,
    autoplay: true,
    fullscreen: true,
    fullscreenWeb: true,
    playsInline: true,
    customType: {
      m3u8: function (video, url) {
        if (Hls.isSupported()) {
          const hls = new Hls({
            enableWorker: true,
            lowLatencyMode: false,
            liveSyncDurationCount: 3,
            maxBufferLength: 8,
            maxMaxBufferLength: 16
          });

          hls.loadSource(url);
          hls.attachMedia(video);
          currentHls = hls;

          hls.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
              if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                hls.startLoad();
              } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                hls.recoverMediaError();
              } else {
                hls.destroy();
              }
            }
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = url;
        }
      },
    },
  });
}

function closePlayer() {
  if (currentHls) {
    currentHls.stopLoad();
    currentHls.detachMedia();
    currentHls.destroy();
    currentHls = null;
  }
  if (artInstance) {
    if (artInstance.video) {
      artInstance.video.pause();
      artInstance.video.removeAttribute('src');
      artInstance.video.load();
    }
    artInstance.destroy(true);
    artInstance = null;
  }
  document.getElementById("player-container").style.display = "none";
  document.querySelectorAll(".channel-card").forEach(c => c.classList.remove("active-stream"));
}

document.addEventListener("DOMContentLoaded", fetchCategories);
</script>
</body>
</html>
