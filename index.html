<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث المباشر</title>
    <!-- استدعاء مكتبة تشغيل البث HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        video {
            width: 100%;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            background: #000;
        }
        .controls {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            font-size: 16px;
            background-color: #e50914;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #b20710;
        }
    </style>
</head>
<body>

    <h2>مشغل القنوات الرياضية</h2>
    
    <video id="my-video" controls autoplay></video>

    <div class="controls">
        <!-- أزرار تشغيل القنوات -->
        <button onclick="fetchAndPlay('bein1')">تشغيل beIN Sports 1</button>
        <button onclick="fetchAndPlay('bein2')">تشغيل beIN Sports 2</button>
    </div>

    <script>
        function fetchAndPlay(streamName) {
            const video = document.getElementById('my-video');
            
            // استخدام مسار الـ API المباشر على Vercel لجلب البث وتجاوز الحظر
            const workerUrl = `/api/proxy?stream=${streamName}`;

            alert('جاري جلب البث لقناة: ' + streamName);

            fetch(workerUrl)
                .then(response => response.text())
                .then(m3u8Link => {
                    if (Hls.isSupported()) {
                        const hls = new Hls();
                        hls.loadSource(m3u8Link);
                        hls.attachMedia(video);
                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            video.play();
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        video.src = m3u8Link;
                        video.addEventListener('loadedmetadata', function() {
                            video.play();
                        });
                    }
                })
                .catch(err => console.error('خطأ في جلب البث:', err));
        }
    </script>
</body>
</html>
