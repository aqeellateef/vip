<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألوان سبورت - VIP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: Tahoma, sans-serif;
            padding: 15px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00ffcc;
            font-size: 22px;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-width: 800px;
            margin: 0 auto;
        }
        .channel-card {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .channel-card:hover {
            border-color: #00ffcc;
            background: #21262d;
        }
        .channel-name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .channel-badge {
            font-size: 12px;
            color: #ff4757;
            background: rgba(255, 71, 87, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }
        /* نافذة المشغل بملء الشاشة الأفقي */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        #player-modal iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            width: 40px; height: 40px;
            font-size: 20px;
            cursor: pointer;
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>قنوات ألوان سبورت VIP</h1>
    <div class="channels-grid" id="grid">جاري تحميل القنوات...</div>

    <!-- مشغل البث -->
    <div id="player-modal">
        <button class="close-btn" onclick="closePlayer()">✕</button>
        <iframe id="video-frame" src="" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
    </div>

    <script>
        async function loadChannels() {
            try {
                let response = await fetch('channels.json');
                let channels = await response.json();
                let grid = document.getElementById('grid');
                grid.innerHTML = '';
                
                channels.forEach(ch => {
                    let card = document.createElement('div');
                    card.className = 'channel-card';
                    card.innerHTML = `
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-badge">${ch.badge}</div>
                    `;
                    card.onclick = () => openPlayer(ch.url);
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('grid').innerHTML = 'خطأ في تحميل القنوات';
            }
        }

        function openPlayer(url) {
            let modal = document.getElementById('player-modal');
            let iframe = document.getElementById('video-frame');
            iframe.src = url;
            modal.style.display = 'flex';

            // محاولة فرض وضع ملء الشاشة والدوران الأفقي تلقائياً إذا أمكن
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }
            if (modal.requestFullscreen) {
                modal.requestFullscreen().catch(() => {});
            }
        }

        function closePlayer() {
            let modal = document.getElementById('player-modal');
            let iframe = document.getElementById('video-frame');
            iframe.src = '';
            modal.style.display = 'none';

            if (document.exitFullscreen) {
                document.exitFullscreen().catch(() => {});
            }
            if (screen.orientation && screen.orientation.unlock) {
                screen.orientation.unlock();
            }
        }

        loadChannels();
    </script>
</body>
</html>
