<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألوان سبورت - مشغل الويب</title>
    <!-- مكتبة تشغيل تدعم روابط البث المباشر المتقدمة HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: Tahoma, sans-serif;
            padding: 15px;
        }
        h1 {
            text-align: center;
            margin-bottom: 15px;
            color: #00ffcc;
            font-size: 20px;
        }
        /* تصميم المشغل الثابت في الأعلى */
        .player-box {
            width: 100%;
            max-width: 700px;
            margin: 0 auto 20px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        video {
            width: 100%;
            height: auto;
            max-height: 400px;
            display: block;
            background: #000;
        }
        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-width: 700px;
            margin: 0 auto;
        }
        .channel-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .channel-card:hover {
            border-color: #00ffcc;
            background: #21262d;
        }
        .channel-name {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .channel-badge {
            font-size: 11px;
            color: #ff4757;
        }
    </style>
</head>
<body>

    <h1>قنوات ألوان سبورت VIP</h1>

    <!-- مشغل الفيديو الطبيعي لمتصفح كروم -->
    <div class="player-box">
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <!-- شبكة القنوات -->
    <div class="channels-grid" id="grid">جاري تحميل القنوات...</div>

    <script>
        async function loadChannels() {
            try {
                let res = await fetch('channels.json');
                let channels = await res.json();
                let grid = document.getElementById('grid');
                grid.innerHTML = '';
                
                // تشغيل أول قناة افتراضياً عند فتح الموقع
                if(channels.length > 0) {
                    playChannel(channels[0].url);
                }

                channels.forEach(ch => {
                    let card = document.createElement('div');
                    card.className = 'channel-card';
                    card.innerHTML = `
                        <div class="channel-name">${ch.name}</div>
                        <div class="channel-badge">${ch.badge}</div>
                    `;
                    card.onclick = () => playChannel(ch.url);
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('grid').innerHTML = 'خطأ في تحميل القنوات';
            }
        }

        function playChannel(url) {
            var video = document.getElementById('videoPlayer');
            
            if (Hls.isSupported() && url.includes('.m3u8')) {
                var hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED,function() {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // لدعم متصفحات السافاري والأجهزة الأخرى
                video.src = url;
                video.addEventListener('loadedmetadata',function() {
                    video.play().catch(() => {});
                });
            } else {
                // للروابط المباشرة العادية
                video.src = url;
                video.play().catch(() => {});
            }
        }

        loadChannels();
    </script>
</body>
</html>
